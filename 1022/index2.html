<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <style>
        #hub{
            position:fixed;
            top: 20px;
            left: 20px;
            z-index:999;
        }
        button{
            font-size: 20px;
            padding: 20 20;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 10px;
            margin-right: 10px;
        }
        select{
       font-size: 18px;
       padding: 10px 12px;
       border-radius: 8px;
}
    </style>


</head>

<body>
    <div id="hub">
        <select name="" id="animationSelect">
            <option value="RobotArmature|Robot_Walking">歩く</option>
            <option value="RobotArmature|Robot_Dance">踊る</option>
        </select>

    </div>
    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">
            <a-gltf-model id="robot" src="robot.glb" position="0 0 0.5" scale="0.3 0.3 0.3" rotation="-90 0 0">

            </a-gltf-model>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
    <script>
        const robot = document.getElementById("robot");
        const animationSelect = document.getElementById("animationSelect");

        function changerobot(){
            robot.setAttribute("animation-mixer","clip",animationSelect.value);
        }
        animationSelect.addEventListener("change",changerobot)

    </script>
</body>

</html>
